<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Details - 3DXENON</title>
  
  <!-- Google font -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="css/card-details.css">
  <link rel="stylesheet" href="css/translations.css" />
  <link rel="icon" type="image/x-icon" href="res/logo.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body>

  <!-- Header/Navigation -->
  <header class="detail-header">
    <div class="detail-nav">
      <div class="logo">
        <img src="res/logo.png" alt="Logo"> 
        3DXENON
      </div>
      <button id="langToggle" class="lang-toggle" aria-label="Switch language">🇬🇧</button>
       <a href="index.html#case" class="back-btn">
         <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
           <path d="M19 12H5M12 19l-7-7 7-7"/>
         </svg>
         <span data-i18n="details.back">Back to Gallery</span>
       </a>
    </div>
  </header>

  <!-- Hero Section with Image -->
  <section class="detail-hero">
    <div class="detail-hero-image">
      <img id="heroImage" src="" alt="">
      <div class="detail-hero-overlay"></div>
    </div>
    <div class="detail-hero-content">
      <div class="detail-category" id="detailCategory"></div>
      <h1 class="detail-title" id="detailTitle"></h1>
    </div>
  </section>

  <!-- Project Info Section -->
  <section class="project-info">
    <div class="project-info-container">
      
      <!-- Main Content -->
      <div class="project-main">
        
         <div class="content-block">
           <h2 class="block-title" data-i18n="details.overview">Project Overview</h2>
           <p class="block-text" id="detailOverview"></p>
         </div>

         <div class="content-block">
           <h2 class="block-title" data-i18n="details.challenge">The Challenge</h2>
           <p class="block-text" id="detailChallenge"></p>
         </div>

         <div class="content-block">
           <h2 class="block-title" data-i18n="details.solution">Our Solution</h2>
           <p class="block-text" id="detailSolution"></p>
         </div>

         <div class="content-block">
           <h2 class="block-title" data-i18n="details.results">Results & Impact</h2>
           <p class="block-text" id="detailResults"></p>
         </div>

         <div class="content-block">
           <h2 class="block-title" data-i18n="details.gallery">Project Gallery</h2>
           <div class="detail-gallery" id="detailGallery">
           </div>
         </div>

      </div>

      <!-- Sidebar -->
      <aside class="project-sidebar">
        
        <!-- Services -->
         <div class="sidebar-card">
           <h3 class="sidebar-title" data-i18n="details.services">Services Provided</h3>
           <ul class="services-list" id="detailServices">
           </ul>
         </div>

        <!-- CTA -->
         <div class="sidebar-card sidebar-cta">
           <h3 class="sidebar-title" data-i18n="details.cta.title">Interested in Similar Project?</h3>
           <p class="sidebar-text" data-i18n="details.cta.text">Let's discuss how we can bring your vision to life.</p>
           <a href="contact.html" class="cta-btn" data-i18n="details.cta.btn">
             Get in Touch
             <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
               <path d="M5 12h14M12 5l7 7-7 7"/>
             </svg>
           </a>
         </div>

      </aside>

    </div>
  </section>

  <!-- Related Projects -->
   <section class="related-projects">
     <div class="related-container">
       <h2 class="related-title" data-i18n="details.related">Other Case Studies</h2>
       <div class="related-grid" id="relatedProjects">
       </div>
     </div>
   </section>

<!-- Footer -->
 <footer class="card-footer">
   <div class="footer-content">
     <p data-i18n="footer.copyright">© 2026 3DXENON — all rights reserved</p>

    <div class="footer-social">
      
      <!-- LinkedIn -->
      <a href="https://www.linkedin.com/company/3d-xenon/" aria-label="LinkedIn">
        <i class="fa-brands fa-linkedin-in"></i>
      </a>

      <!-- WhatsApp -->
      <a href="https://wa.me/37258055031" aria-label="WhatsApp">
        <i class="fa-brands fa-whatsapp"></i>
      </a>

      <!-- YouTube -->
      <a href="https://www.youtube.com/@shitos557" aria-label="YouTube">
        <i class="fa-brands fa-youtube"></i>
      </a>

    </div>
  </div>
</footer>


  <script src="script/translations.js" defer></script>
   <script src="script/translations.js" defer></script>
   <script src="script/card-details.js"></script>
</body>
</html>
